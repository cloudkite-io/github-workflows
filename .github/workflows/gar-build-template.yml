name: Build and push Docker image to GAR

on:
  workflow_call:
    inputs:
      GAR_GCP_PROJECT:
        description: Google Cloud project that hosts the GAR repository.
        required: true
        type: string
      GAR_REPO_DOMAIN:
        description: GAR Docker host, for example us-central1-docker.pkg.dev.
        required: true
        type: string
      GAR_REPO_PATH:
        description: GAR image path after the host, for example project/repository/image.
        required: true
        type: string
      SERVICE_ACCOUNT:
        description: Service account impersonated through WIF.
        required: true
        type: string
      WORKLOAD_IDENTITY_PROVIDER:
        description: Full Google WIF provider resource name.
        required: true
        type: string
      RUNNER_LABELS:
        description: JSON array of runner labels.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      DOCKERFILE_PATH:
        description: Dockerfile path relative to the caller repository.
        required: false
        type: string
        default: ./Dockerfile
      DOCKER_CONTEXT:
        description: Docker build context relative to the caller repository.
        required: false
        type: string
        default: .
      PLATFORM:
        description: Docker target platform.
        required: false
        type: string
        default: linux/amd64
      BUILD_ARGS:
        description: JSON object containing non-secret, single-line string build arguments.
        required: false
        type: string
        default: '{}'
      PROJECT_ENV:
        description: Deprecated compatibility input; mutable environment tags are no longer published.
        required: false
        type: string
        default: ''
    outputs:
      image_uri:
        description: Immutable GAR image URI including its sha256 digest.
        value: ${{ jobs.build.outputs.image_uri }}
      image_digest:
        description: GAR sha256 digest.
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.RUNNER_LABELS) }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.push.outputs.image_uri }}
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - name: Validate build inputs
        env:
          BUILD_ARGS_JSON: ${{ inputs.BUILD_ARGS }}
          GAR_REPO_DOMAIN: ${{ inputs.GAR_REPO_DOMAIN }}
          GAR_REPO_PATH: ${{ inputs.GAR_REPO_PATH }}
          GAR_GCP_PROJECT: ${{ inputs.GAR_GCP_PROJECT }}
          PLATFORM: ${{ inputs.PLATFORM }}
          SERVICE_ACCOUNT: ${{ inputs.SERVICE_ACCOUNT }}
          WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GAR_GCP_PROJECT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$GAR_REPO_DOMAIN" =~ ^[a-z0-9-]+-docker\.pkg\.dev$ ]]
          [[ "$GAR_REPO_PATH" =~ ^[a-z0-9][a-z0-9._/-]*$ ]]
          [[ "$PLATFORM" =~ ^linux/[a-z0-9_+-]+$ ]]
          [[ "$SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]]
          [[ "$WORKLOAD_IDENTITY_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]]
          printf '%s' "$BUILD_ARGS_JSON" | jq -e '
            type == "object" and
            all(to_entries[];
              (.key | test("^[A-Za-z_][A-Za-z0-9_]*$")) and
              (.value | type == "string") and
              (.value | test("^[^\\u0000\\r\\n]*$"))
            )
          ' >/dev/null

      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image before Google authentication
        id: build
        env:
          BUILD_ARGS_JSON: ${{ inputs.BUILD_ARGS }}
          # NOTE: this must NOT be named DOCKER_CONTEXT. That is a reserved Docker CLI
          # variable that selects the docker context (i.e. the builder), not the build
          # context path, so setting it to "." fails with: no builder "." found
          BUILD_CONTEXT_PATH: ${{ inputs.DOCKER_CONTEXT }}
          DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
          GAR_REPO_DOMAIN: ${{ inputs.GAR_REPO_DOMAIN }}
          GAR_REPO_PATH: ${{ inputs.GAR_REPO_PATH }}
          PLATFORM: ${{ inputs.PLATFORM }}
        run: |
          set -euo pipefail
          IMAGE_REPOSITORY="${GAR_REPO_DOMAIN}/${GAR_REPO_PATH}"
          IMAGE_TAG_URI="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker_build_args=()
          while IFS= read -r build_arg; do
            docker_build_args+=(--build-arg "$build_arg")
          done < <(printf '%s' "$BUILD_ARGS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"')
          docker build \
            --platform "$PLATFORM" \
            --file "$DOCKERFILE_PATH" \
            --tag "$IMAGE_TAG_URI" \
            "${docker_build_args[@]}" \
            "$BUILD_CONTEXT_PATH"
          printf 'image_tag_uri=%s\n' "$IMAGE_TAG_URI" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2.1.7
        with:
          project_id: ${{ inputs.GAR_GCP_PROJECT }}
          workload_identity_provider: ${{ inputs.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ inputs.SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.2

      - name: Configure GAR Docker authentication
        env:
          GAR_REPO_DOMAIN: ${{ inputs.GAR_REPO_DOMAIN }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$GAR_REPO_DOMAIN" --quiet

      - name: Push image and resolve digest
        id: push
        env:
          IMAGE_TAG_URI: ${{ steps.build.outputs.image_tag_uri }}
        run: |
          set -euo pipefail
          EXISTING_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG_URI" --format='value(image_summary.digest)' 2>/dev/null || true)"
          if [[ "$EXISTING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            IMAGE_DIGEST="$EXISTING_DIGEST"
          else
            docker push "$IMAGE_TAG_URI"
            IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG_URI" --format='value(image_summary.digest)')"
          fi
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          IMAGE_REPOSITORY="${IMAGE_TAG_URI%:*}"
          IMAGE_URI="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
          {
            printf 'image_uri=%s\n' "$IMAGE_URI"
            printf 'image_digest=%s\n' "$IMAGE_DIGEST"
          } >> "$GITHUB_OUTPUT"
